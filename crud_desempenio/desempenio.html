<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="../style.css" rel="stylesheet">
    <link rel="stylesheet" href="../variacion_boots5.css">
  </head>
  <body class="container mt-5">
    <div class="card mt-4 p-4" id="contenido">
          <div id="CrearEvaluacion">
            <form id="form">
              <div class="form-group row">
                <label for="puntualidad" class="entryInput col-sm-2 col-form-label my-2">Puntualidad</label>
                  <div class="col-sm-10">
                      <input type="number" class="form-control" id="puntualidad" min="1" max="10" placeholder="Ingrese un numero" required>
                  </div>
              </div>
              <div class="form-group row">
                <label for="companierismo" class="entryInput col-sm-2 col-form-label my-2">Companierismo</label>
                  <div class="col-sm-10">
                      <input type="number" class="form-control" id="companierismo" min="1" max="10" placeholder="Ingrese un numero" required>
                  </div>
              </div>
              <div class="form-group row">
                <label for="autoconciencia" class="entryInput col-sm-2 col-form-label my-2">Autoconciencia</label>
                  <div class="col-sm-10">
                    <input type="number" id="autoconciencia" class="form-control" min="1" max="10" placeholder="Ingrese un numero" required>
                  </div>
              </div>
              <div class="form-group row">
                <label for="liderazgo" class="entryInput col-sm-2 col-form-label my-2">Liderazgo</label>
                <div class="col-sm-10">
                  <input type="number" id="liderazgo" class="form-control" min="1" max="10" placeholder="Ingrese un numero" required>
                </div>
              </div>
            <div>
                <button id="GuardaDesempenio" type="submit" class="btn btn-primary">Guardar</button>
            </div>
            </form>
      </div>
    </div>
    <script src="desempenio.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
