<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Empleado</title>
    <link rel="stylesheet" href="variacion_boots5.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Información del Empleado</h1>
        <div id="info-container" class="card mt-4 p-4">
            <!-- La información del empleado se mostrará aquí -->
        </div>
        <h1 class="text-center">Evaluacion de desempeño</h1>
        <div id="desempeño-container" class="card mt-4 p-4">
            <!-- La información del empleado se mostrará aquí -->
        </div>
        <h1 id="h1ausencia" class="text-center">Ausencia</h1>
        <div id="info-ausencia" class="card mt-4 p-4">
            <!-- La información del empleado se mostrará aquí -->
        </div>
        <div class="d-flex justify-content-between mt-4 mb-5">
            <button id="volverBtn" class="btn btn-secondary">Volver</button>
            <!-- Puedes agregar más botones aquí -->
            <button id="AgregardesempenioBtn" class="btn btn-primary">Agregar evaluacion</button>
            <button id="verausenciaBtn" class="btn btn-outline-light">Ausencias</button>
            <button id="ausenciaBtn" class="btn btn-outline-light">Agregar Ausencias</button>
            <button id="EditarBtn" class="btn btn-primary">Editar</button>
            <button id="eliminarBtn" class="btn btn-danger">Eliminar</button>
        </div>
    </div>
    <div class="card mt-4" id="asistencia">
        <h1 class="text-center">Registrar Inasistencia</h1>
        <form id="guardarAsistencia">
            <div>
                <label for="fecha_salida">Fecha salida: </label>
                <input type="date" name="fecha_salida" id="fecha_salida" class="col-sm-2 col-form-label my-2" required>
            </div>
            <div>
                <label for="fecha_entrada">Fecha entrada:</label>
                <input type="date" name="fecha_entrada" id="fecha_entrada" class="col-sm-2 col-form-label my-2" required>
            </div>
            <div>
                <label for="tipo_ausencia">Tipo ausencia:</label>
                <select name="tipo_ausencia_idtipo_ausencia" id="tipo_ausencia" class="col-sm-2 col-form-label my-2" required>
                    <option value="">Motivo Ausencia</option>
                </select>
            </div>
            <input type="submit" name="submit" value="Agregar" id="ausenciaBtn" class="btn btn-primary mt-4 mb-5">
        </form>
    </div>
    <script src="informacion.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
